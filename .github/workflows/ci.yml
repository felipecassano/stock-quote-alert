name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore stock-quote-alert.slnx

      - name: Build
        run: dotnet build stock-quote-alert.slnx --no-restore -c Release

      - name: Test
        run: dotnet test stock-quote-alert.slnx --no-build -c Release
